[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpce"
version = "0.1.0"
description = "Capacity-Profile Clustering Ensemble for rare cell discovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<1.6",
    "anndata>=0.11,<0.12",
    "scanpy>=1.11,<1.12",
    "igraph>=0.11,<0.12",
    "leidenalg>=0.10,<0.11",
    "scikit-misc>=0.5,<0.6",
    "pandas>=2.1,<3",
    "zarr>=2.18,<3",
]

[project.scripts]
cpce = "cpce.cli:main"

[tool.setuptools.packages.find]
include = ["cpce*"]
